version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tooling:
        patterns: ['eslint', '@eslint/*', 'globals', 'prettier', 'tailwindcss', '@tailwindcss/*', 'subset-font']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
