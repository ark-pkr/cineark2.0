name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:secrets
      # Only shipped code matters here; dev-tool advisories are tracked by Dependabot.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run verify
      - name: Build leaves the tree unchanged
        run: git diff --exit-code
